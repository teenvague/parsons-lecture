<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CD Lecture</title><meta name="description" content="A moving wall of work for a Parsons lecture."><link rel="icon" type="image/png" href="favicon-lecture.png"><link rel="stylesheet" href="style.css?v=caption-inset-20-1"><script defer src="content.js?v=square-priority-1"></script><script defer src="app.js?v=bb-fullbleed-1"></script><script defer src="caption-layout.js"></script><script defer src="captions.js"></script></head>
